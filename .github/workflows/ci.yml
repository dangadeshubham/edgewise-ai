name: EDGEWISE AI CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Security & Hygiene Checks
  # =========================================================================
  security-audit:
    name: Security & Secret Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify .env is NOT tracked in git
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "CRITICAL ERROR: .env file is committed to git!"
            exit 1
          fi
          echo ".env is cleanly ignored."

      - name: Scan repository for accidentally committed secrets
        run: |
          echo "Scanning codebase for hardcoded private keys and API tokens..."
          # Reject committed private keys or known token patterns
          if grep -rEi "(-----BEGIN PRIVATE KEY-----|-----BEGIN RSA PRIVATE KEY-----)" --exclude-dir={.git,node_modules,.venv} .; then
            echo "ERROR: Found unencrypted private key in repository!"
            exit 1
          fi
          echo "Secret scan passed."

  # =========================================================================
  # 2. Backend CI (Lint, Typecheck & Unit Tests)
  # =========================================================================
  backend-ci:
    name: Backend CI (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy pytest-cov

      - name: Backend Lint Check (Ruff)
        run: |
          cd backend
          ruff check app/ tests/

      - name: Backend Type Check (Mypy)
        run: |
          cd backend
          mypy app/ --ignore-missing-imports || true

      - name: Run Backend Unit Tests (Phases 5, 6, 7, 8, 10)
        run: |
          cd backend
          pytest tests/unit/ -v --tb=short

  # =========================================================================
  # 3. Frontend CI (Lint, TypeScript, Tests & Production Build)
  # =========================================================================
  frontend-ci:
    name: Frontend CI (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend Lint (oxlint)
        run: |
          cd frontend
          npx oxlint

      - name: TypeScript Check & Production Build
        run: |
          cd frontend
          npm run build

      - name: Run Frontend Tests (Vitest)
        run: |
          cd frontend
          npx vitest run

      - name: Verify Bundle Hygiene (No Embedded Secrets)
        run: |
          echo "Scanning built frontend distribution for leaked secrets..."
          if grep -rEi "(qdrant_api_key=[a-zA-Z0-9]{10,}|Bearer [a-zA-Z0-9_\-\.]{20,})" frontend/dist/; then
            echo "ERROR: Leaked credentials found in compiled frontend assets!"
            exit 1
          fi
          echo "Frontend distribution bundle is clean."

  # =========================================================================
  # 4. Docker Build & Compose Validation
  # =========================================================================
  docker-validation:
    name: Docker Images Build & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Validate Production Compose Config
        run: |
          cp .env.example .env
          docker compose config

      - name: Validate Development Compose Config
        run: |
          docker compose -f docker-compose.dev.yml config

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: edgewise-frontend:ci

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: edgewise-backend:ci

  # =========================================================================
  # 5. End-to-End Integration & Resilience in Container
  # =========================================================================
  integration-resilience:
    name: Integration & Resilience Suite
    runs-on: ubuntu-latest
    needs: [ backend-ci, frontend-ci, docker-validation ]
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "curl -f http://localhost:6333/healthz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Phase 11 Resilience Integration Suite
        env:
          QDRANT_SERVER_URL: "http://localhost:6333"
        run: |
          cd backend
          pytest tests/integration/test_phase11_resilience.py -v --tb=short

      - name: Run Integrity Audit Script
        run: |
          cd backend
          python scripts/verify_integrity.py
